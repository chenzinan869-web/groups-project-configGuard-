version: "3.8"

services:
  web:
    image: nginx:1.25.3
    ports:
      - "8080:80"                # Non-sensitive port, no interface restriction needed
    volumes:
      - ./app:/usr/share/nginx/html:ro  # Safe: app-specific relative path, read-only
    environment:
      APP_ENV: production
      APP_PORT: "8080"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  database:
    image: postgres:15.4
    ports:
      - "127.0.0.1:5432:5432"   # Sensitive port bound to localhost only
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: appdb
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512M

  cache:
    image: redis:7.2.4
    ports:
      - "127.0.0.1:6379:6379"   # Sensitive port bound to localhost only
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
